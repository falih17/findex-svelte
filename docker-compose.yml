services:
  # ==========================================================
  # 1. DATABASE: PostgreSQL 16 + PostGIS + pgvector
  # ==========================================================
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: findex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-findex_db}
      POSTGRES_USER: ${POSTGRES_USER:-findex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findex_secret_pwd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-findex_user} -d ${POSTGRES_DB:-findex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - findex-network

  # ==========================================================
  # 2. IN-MEMORY CACHE & QUEUE: Redis 7
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: findex-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_secret_pwd}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_pwd}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - findex-network

  # ==========================================================
  # 3. OBJECT STORAGE: MinIO (S3-Compatible for Face Photos)
  # ==========================================================
  minio:
    image: minio/minio:latest
    container_name: findex-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminsecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - findex-network

  minio-init:
    image: minio/mc:latest
    container_name: findex-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - findex-network

  # ==========================================================
  # 4. AI BIOMETRIC SERVICE: Python + FastAPI + OpenCV + ONNX
  # ==========================================================
  ai-face-service:
    build:
      context: ./services/ai-face-service
      dockerfile: Dockerfile
    container_name: findex-ai-face-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - findex-network

  # ==========================================================
  # 5. CORE BACKEND API: Golang Fiber
  # ==========================================================
  backend-core:
    build:
      context: ./services/backend-core
      dockerfile: Dockerfile
    container_name: findex-backend-core
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - BACKEND_PORT=${BACKEND_PORT:-8080}
      - DATABASE_URL=postgres://${POSTGRES_USER:-findex_user}:${POSTGRES_PASSWORD:-findex_secret_pwd}@postgres:5432/${POSTGRES_DB:-findex_db}?sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret_pwd}
      - AI_SERVICE_URL=http://ai-face-service:8000
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_at_least_32_characters_long!}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-face-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - findex-network

  # ==========================================================
  # 6. FRONTEND PWA & HR DASHBOARD: SvelteKit
  # ==========================================================
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: findex-frontend
    restart: unless-stopped
    environment:
      - PUBLIC_API_URL=http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    depends_on:
      - backend-core
    networks:
      - findex-network

# ==========================================================
# NETWORKS & VOLUMES CONFIGURATION
# ==========================================================
networks:
  findex-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
